<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <title>Document</title>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg facet-navbar">
        <div class="container-fluid">
        
            <!-- Logo and Brand -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <!-- <img src="images/logo-facet.png" alt="Facet Logo" width="55"> -->
                <img src="images/logo-facet.png" alt="Logo" width="100" height="100%" class="d-inline-block align-text-top">
                <a class="navbar-brand" href="#">Facet</a>
                <!-- <span>Facet</span> -->
            </a>
          
            <!-- Toggle Button -->
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
          
            <!-- Navbar Items -->
            <div class="collapse navbar-collapse justify-content-center"
                 id="navbarSupportedContent">
          
                <ul class="navbar-nav align-items-center gap-lg-4">
                
                    <li class="nav-item">
                        <a class="nav-link active" href="#" style="color: #654321;">Home</a>
                    </li>
                  
                    <li class="nav-item">
                        <a class="nav-link" href="#">About Us</a>
                    </li>
                  
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact Us</a>
                    </li>
                  
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#"
                           role="button" data-bs-toggle="dropdown"
                           aria-expanded="false">
                            Collections
                        </a>
                      
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Earrings</a></li>
                            <li><a class="dropdown-item" href="#">Necklaces</a></li>
                            <li><a class="dropdown-item" href="#">Bracelets</a></li>
                            <li><a class="dropdown-item" href="#">Rings</a></li>
                        </ul>
                    </li>
                  
                </ul>
              
                <!-- Search Form -->
                <form class="d-flex search-form" role="search">
                    <input class="form-control" type="search"
                           placeholder="Search" aria-label="Search">
                    <button class="btn search-btn" type="submit">
                        <i class="fa-solid fa-magnifying-glass" style="color: #654321;"></i>
                    </button>
                </form>
              
            </div>
        </div>
    </nav>

      <!-- Banner -->
      <img src="images/Clearbanner_img.jpg" alt="" class="d-block mx-auto banner-img">

      <div class="banner-text">
          <h1>Elegance That Speaks Without Words.</h1>
          <p>Discover jewellery that defines you.</p>
          <a href="#" class="btn">Explore Collection</a>
      </div>





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
